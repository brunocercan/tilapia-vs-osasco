<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Tilápia pixel art — ícone do jogo (fundo verde-escuro do tema) -->
  <rect width="16" height="16" rx="2" fill="#1b2a1b"/>
  <!-- nadadeiras e cauda (verde escuro) -->
  <g fill="#5aa032">
    <rect x="6" y="2" width="4" height="1"/>
    <rect x="1" y="3" width="1" height="1"/><rect x="5" y="3" width="6" height="1"/>
    <rect x="1" y="4" width="2" height="1"/>
    <rect y="5" width="3" height="1"/>
    <rect y="6" width="3" height="1"/>
    <rect y="7" width="4" height="1"/>
    <rect y="8" width="4" height="1"/>
    <rect y="9" width="3" height="1"/>
    <rect x="1" y="10" width="2" height="1"/>
    <rect x="1" y="11" width="1" height="1"/>
    <rect x="7" y="8" width="2" height="2"/>
    <rect x="6" y="12" width="4" height="1"/>
    <rect x="7" y="13" width="2" height="1"/>
  </g>
  <!-- corpo (verde do jogo) -->
  <g fill="#7ec850">
    <rect x="5" y="4" width="9" height="1"/>
    <rect x="4" y="5" width="7" height="1"/><rect x="13" y="5" width="2" height="1"/>
    <rect x="3" y="6" width="8" height="1"/><rect x="13" y="6" width="2" height="1"/>
    <rect x="4" y="7" width="11" height="1"/>
    <rect x="4" y="8" width="3" height="1"/><rect x="9" y="8" width="6" height="1"/>
    <rect x="3" y="9" width="4" height="1"/><rect x="9" y="9" width="6" height="1"/>
    <rect x="13" y="10" width="2" height="1"/>
    <rect x="13" y="11" width="1" height="1"/>
  </g>
  <!-- barriga (verde claro) -->
  <g fill="#a9d97a">
    <rect x="4" y="10" width="9" height="1"/>
    <rect x="5" y="11" width="8" height="1"/>
  </g>
  <!-- olho -->
  <rect x="11" y="5" width="2" height="2" fill="#141414"/>
</svg>
