  <rect x="6" y="2" width="1" height="2" fill="#3f6b28"/>
  <g fill="#f07830">
    <rect x="5" y="3" width="6" height="1"/>
    <rect x="3" y="4" width="10" height="1"/>
    <rect x="2" y="5" width="12" height="8"/>
    <rect x="3" y="13" width="10" height="1"/>
