    <rect x="4" y="10" width="2" height="1"/><rect x="7" y="10" width="2" height="1"/><rect x="10" y="10" width="2" height="1"/>
    <rect x="3" y="9" width="1" height="1"/><rect x="12" y="9" width="1" height="1"/>
